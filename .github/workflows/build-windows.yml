name: Build Windows

on:
  workflow_dispatch:
    inputs:
      target:
        description: "编译目标 (all / x64 / x86)"
        required: false
        default: "all"
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            label: Windows 64位
          - target: i686-pc-windows-msvc
            arch: x86
            label: Windows 32位
    name: 打包 ${{ matrix.label }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: 安装依赖
        run: pnpm install

      - name: 打包 Tauri (${{ matrix.label }})
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || (github.event.inputs.target == 'x64' && matrix.arch == 'x64') || (github.event.inputs.target == 'x86' && matrix.arch == 'x86')
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - name: 上传 MSI 安装包
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || (github.event.inputs.target == 'x64' && matrix.arch == 'x64') || (github.event.inputs.target == 'x86' && matrix.arch == 'x86')
        uses: actions/upload-artifact@v4
        with:
          name: 洽思英语-${{ matrix.arch }}-msi
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: 上传 NSIS 安装包
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || (github.event.inputs.target == 'x64' && matrix.arch == 'x64') || (github.event.inputs.target == 'x86' && matrix.arch == 'x86')
        uses: actions/upload-artifact@v4
        with:
          name: 洽思英语-${{ matrix.arch }}-nsis
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
