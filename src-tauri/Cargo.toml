[package]
name = "app"
version = "0.1.0"
description = "洽思英语学生端"
authors = ["heyue"]
license = ""
edition = "2021"
default-run = "app"

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "1.5.4", features = ["windows7-compat"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
objc = "0.2.7"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
